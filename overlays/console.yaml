  create-agent:
    aliases: [create]
    shortcuts:
      - use: create-agent
    short: "Create an Agent"
    long: "Save an optional Agent preset from a structured input. Project-direct Sessions do not require an Agent; publish only for flows that use a published Agent, including v1."
    example: |
      cat > agent-create.json <<'JSON'
      {
        "input": {
          "projectId": "<project-id>",
          "name": "Research Agent",
          "runtimeId": "<runtime-id>",
          "provider": "<provider>",
          "model": "<model>",
          "prompt": "You research concise answers with citations.",
          "skillIds": []
        }
      }
      JSON
      mosoo console agents create --file agent-create.json -o json
    examples:
      - summary: "Create an Agent from a JSON body file"
        command: "mosoo console agents create-agent --file agent-create.json -o json"
        body_shape:
          input:
            projectId: "<project-id>"
            name: "Research Agent"
            runtimeId: "<runtime-id>"
            provider: "<provider>"
            model: "<model>"
            prompt: "You research concise answers with citations."
            skillIds: []
        output_hints:
          id_path: data.createAgent.id
        follow_up_commands:
          - "mosoo console agents agent --project-id <project-id> --agent-id <id> -o json"
    params:
      input.kind:
        help: "Legacy compatibility field; ignored. Sessions own execution state."
        deprecated: true
    notes:
      - "Uses POST /graphql on the console default hostname (/api)."
      - "For Pi, set input.runtimeId=pi and select a compatible Project provider/model. Built-in models use their catalog protocol; custom credentials use their selected modelProtocol. Pi supports OpenAI Chat Completions, OpenAI Responses, Anthropic Messages, and Google Gemini. OpenCode remains the default for custom providers; select Pi explicitly."
    known_errors:
      - status: 401
        cause: "Missing, invalid, or revoked credential. Run mosoo auth login again after the Project key upgrade."
