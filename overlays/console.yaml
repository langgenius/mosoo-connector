commands:
  accessible-agent-list:
    aliases: [list]
    short: "List accessible Agents"
    long: "List Agents available to the signed-in user for one Project."
    example: |
      mosoo console agents list --project-id <project-id> -o json
    examples:
      - summary: "List Agents available to the signed-in user for one Project and capture an Agent ID."
        command: "mosoo console agents accessible-agent-list --project-id <project-id> -o json"
        body_shape:
          projectId: "<project-id>"
        output_hints:
          list_path: data.accessibleAgentList
          id_path: "data.accessibleAgentList[0].id"
        follow_up_commands:
          - "mosoo console agents agent --project-id <project-id> --agent-id <agent-id> -o json"
    notes:
      - "Uses POST /graphql on the console default hostname (/api)."
    known_errors:
      - status: 401
        cause: "Missing, invalid, or revoked credential. Run mosoo auth login again after the Project key upgrade."
  add-session-resource:
    short: "Add a session resource"
    long: "Add a session resource via the mosoo Console GraphQL API (Sessions surface). Use mosoo auth login for account access. Project API keys support only Agent configuration in their own Project."
