  test-vendor-credential:
    aliases: [test]
    short: "Test a provider key"
    long: "Test provider credential material before or after saving it."
    example: |
      mosoo console credentials test-vendor-credential \
        --input-project-id <project-id> \
        --input-vendor-id openai \
        --input-model-id gpt-4o-mini \
        --input-api-key-env OPENAI_API_KEY \
        -o json
    examples:
      - summary: "Smoke test an OpenAI provider key from the environment before saving it."
        command: "mosoo console credentials test-vendor-credential \\\n  --input-project-id <project-id> \\\n  --input-vendor-id openai \\\n  --input-model-id gpt-4o-mini \\\n  --input-api-key-env OPENAI_API_KEY \\\n  -o json"
        body_shape:
          input:
            projectId: "<project-id>"
            vendorId: openai
            modelId: gpt-4o-mini
            apiKey: "<read from OPENAI_API_KEY>"
        follow_up_commands:
          - "mosoo console credentials create-vendor-credential --input-project-id <project-id> --input-vendor-id openai --input-name \"OpenAI\" --input-api-key-env OPENAI_API_KEY -o json"
    params:
      input.modelProtocol:
        help: "Custom endpoint protocol to test: openai-chat-completions, openai-responses, anthropic-messages, or google-gemini. Match the saved credential and endpoint."
    notes:
      - "Uses POST /graphql on the console default hostname (/api)."
      - "For a custom provider, pass the same input.modelProtocol, input.apiBase, and input.modelId used for execution. A connection test does not verify a complete streamed tool-using Run."
      - "Prefer --input-api-key-env, --input-api-key-file, or --input-api-key-stdin so provider secrets do not appear in shell history."
      - "Current Lathe required variable flags must be present; --set and --set-str can supplement body fields but do not replace required flags."
    known_errors:
      - status: 401
        cause: "Missing, invalid, or revoked credential. Run mosoo auth login again after the Project key upgrade."
