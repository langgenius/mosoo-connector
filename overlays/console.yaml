  create-agent:
    aliases: [create]
    shortcuts:
      - use: create-agent
    short: "Create an Agent"
    long: "Create an Agent draft from a structured input. Publish it with publish-agent after provider credentials are configured."
    example: |
      cat > agent-create.json <<'JSON'
      {
        "input": {
          "projectId": "<project-id>",
          "name": "Research Agent",
          "kind": "<pet-or-cattle>",
          "runtimeId": "<runtime-id>",
          "provider": "<provider>",
          "model": "<model>",
          "prompt": "You research concise answers with citations.",
          "skillIds": []
        }
      }
      JSON
      mosoo console agents create --file agent-create.json -o json
    examples:
      - summary: "Create an Agent from a JSON body file"
        command: "mosoo console agents create-agent --file agent-create.json -o json"
        body_shape:
          input:
            projectId: "<project-id>"
            name: "Research Agent"
            kind: pet
            runtimeId: "<runtime-id>"
            provider: "<provider>"
            model: "<model>"
            prompt: "You research concise answers with citations."
            skillIds: []
        output_hints:
          id_path: data.createAgent.id
        follow_up_commands:
          - "mosoo console agents agent --project-id <project-id> --agent-id <id> -o json"
          - "mosoo console agents publish-agent --input-project-id <project-id> --input-agent-id <id> -o json"
    notes:
      - "Uses POST /graphql on the console default hostname (/api)."
    known_errors:
      - status: 401
        cause: "Missing, invalid, or revoked credential. Run mosoo auth login again after the Project key upgrade."
