  create-vendor-credential:
    aliases: [create]
    shortcuts:
      - use: add-key
    short: "Add a provider key"
    long: "Create a provider credential for a Project while keeping API keys out of shell history."
    example: |
      mosoo console credentials create-vendor-credential \
        --input-project-id <project-id> \
        --input-vendor-id openai \
        --input-name "OpenAI" \
        --input-api-key-env OPENAI_API_KEY \
        -o json
    examples:
      - summary: "Create an OpenAI provider credential from an environment variable"
        command: "mosoo console credentials create-vendor-credential \\\n  --input-project-id <project-id> \\\n  --input-vendor-id openai \\\n  --input-name \"OpenAI\" \\\n  --input-api-key-env OPENAI_API_KEY \\\n  -o json"
        body_shape:
          input:
            projectId: "<project-id>"
            vendorId: openai
            name: OpenAI
            apiKey: "$OPENAI_API_KEY"
        output_hints:
          id_path: data.createVendorCredential.id
        follow_up_commands:
          - "mosoo console credentials vendor-credential-list --project-id <project-id> -o json"
    notes:
      - "Uses POST /graphql on the console default hostname (/api)."
      - "For preset providers such as openai or anthropic, omit input.models unless mosoo asks for explicit model configuration."
      - "Use --input-api-key-env, --input-api-key-file, or --input-api-key-stdin so provider keys do not appear in shell history."
      - "Current Lathe required variable flags must be present; safe input modes satisfy the required input.apiKey variable."
    known_errors:
      - status: 401
        cause: "Missing, invalid, or revoked credential. Run mosoo auth login again after the Project key upgrade."
