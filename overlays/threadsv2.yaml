commands:
  agent-files-upload:
    use: upload
    short: "Upload a file for an agent"
    long: "Upload one file before creating or continuing a thread, then reference the returned file ID in resources[].file_id."
    example: |
      mosoo public-thread-api-v2 files upload --agent-id <agent-id> --file <path>
    examples:
      - summary: "Upload a file and capture the draft file ID for a thread request."
        command: "mosoo public-thread-api-v2 files upload --agent-id <agent-id> --file <path> -o json"
        output_hints:
          id_path: file.id
        follow_up_commands:
          - "mosoo public-thread-api-v2 threads create --agent-id <agent-id> --file thread-create.json -o json"
    known_errors:
      - status: 401
        cause: "Invalid or revoked credential. Rotate the Project API key or run mosoo auth login again."
      - status: 400
        cause: "The multipart request must contain exactly one file field."
      - status: 413
        cause: "The upload exceeds the Public API file size limit."
  archive:
    short: "Archive a thread"
    long: "Mark a thread as archived."
    example: |
      mosoo public-thread-api-v2 threads archive --thread-id <thread-id>
  create:
    short: "Create a thread for an agent"
    long: "Create a durable Session from the latest saved private Agent configuration, without publishing. The body and userId are optional; a supplied userId must be a non-blank string. Existing Sessions retain their admitted configuration. Optional top-level maxCostUsd applies to the initial input turn and requires a configured deployment budget policy. In-flight usage can exceed this estimate cap. Per-turn budgets are unreleased; verify support on the target deployment before using maxCostUsd."
    example: |
      mosoo public-thread-api-v2 threads create --agent-id <agent-id> --file body.json
    examples:
      - summary: "Create a Thread with an initial user message and capture the Thread ID."
        command: "mosoo public-thread-api-v2 threads create --agent-id <agent-id> --file thread-create.json -o json"
        body_shape:
          input:
            type: user.message
            content:
              -
                type: text
                text: "Say hello from the API."
        output_hints:
          id_path: thread.id
        follow_up_commands:
          - "mosoo public-thread-api-v2 threads retrieve --thread-id <thread-id> -o json"
          - "mosoo public-thread-api-v2 events list-events --thread-id <thread-id> -o json"
      - summary: "Create a Thread with a file uploaded through the Agent endpoint."
        command: "mosoo public-thread-api-v2 threads create --agent-id <agent-id> --file thread-create-with-file.json -o json"
        body_shape:
          input:
            type: user.message
            content:
              -
                type: text
                text: "Summarize the attachment."
          resources:
            -
              type: file
              file_id: "<file-id>"
        output_hints:
          id_path: thread.id
        follow_up_commands:
          - "mosoo public-thread-api-v2 events list-events --thread-id <thread-id> -o json"
      - summary: "Create an initial turn with a caller-selected estimate cap; set TURN_MAX_COST_USD to your chosen amount first."
        command: "mosoo public-thread-api-v2 threads create --agent-id <agent-id> --set input.type=user.message --set \"input.content[0].type=text\" --set-str \"input.content[0].text=Start this turn.\" --set \"maxCostUsd=$TURN_MAX_COST_USD\" -o json"
        output_hints:
          id_path: thread.id
    notes:
      - "Set top-level maxCostUsd with --set maxCostUsd=<usd-amount> or a numeric JSON field in --file. Choose a positive USD amount with at most six decimal places, within the deployment policy maximum."
      - "The cap applies only to this turn. Omission uses the deployment's configured default when available; the CLI does not supply a default amount or platform-funded inference."
      - "A deployment budget policy is required for an explicit cap. Without it the request fails with 409 readiness_blocked. Check the target's v2 schema and budget readiness; the last verified staging source is 69de7cea without budgets, and e060f465 budget deployment and live validation are pending."
      - "Costs are estimates, not invoices. In-flight usage can exceed the cap; reaching the threshold rejects new model requests, and unknown usage fails closed. Native provider protocols are unchanged."
      - "Budgeted runs expose run.budget with capUsd, estimatedCostUsd and state: available, settling, budget_exhausted or budget_usage_unavailable. Unavailable usage means the estimate covers only established usage."
      - "A budget failure remains a failed run. Inspect available files and events; --final-output is only for completed runs, and a failed turn does not guarantee a successful checkpoint."
    known_errors:
      - status: 400
        cause: "The body or userId is invalid, or maxCostUsd is invalid, exceeds the deployment maximum, or is supplied without input."
      - status: 404
        cause: "Agent not found or outside this Project."
      - status: 409
        cause: "readiness_blocked: an explicit maxCostUsd was supplied but this deployment has no budget policy."
  delete:
    short: "Delete a thread"
    long: "Permanently delete a thread owned by this caller."
    example: |
      mosoo public-thread-api-v2 threads delete --thread-id <thread-id>
  list-for-agent:
    short: "List threads for an agent"
    long: "List threads created against an agent API endpoint."
    example: |
      mosoo public-thread-api-v2 threads list-for-agent --agent-id <agent-id>
  public-files-delete-file:
    use: delete-file
    short: "Delete a file"
    long: "Delete a pre-thread draft file or a file attached to a writable thread."
    example: |
      mosoo public-thread-api-v2 files delete-file --file-id <file-id> -o json
  public-files-download:
    use: download
    short: "Download file content"
    long: "Download the bytes of a ready thread attachment or agent artifact."
    example: |
      mosoo public-thread-api-v2 files download --file-id <file-id> -o raw
  public-files-retrieve-file:
    use: retrieve-file
    short: "Retrieve file metadata"
    long: "Retrieve public metadata for a draft or thread file."
    example: |
      mosoo public-thread-api-v2 files retrieve-file --file-id <file-id> -o json
  retrieve:
    short: "Retrieve a thread"
    long: "Fetch thread metadata and status."
    example: |
      mosoo public-thread-api-v2 threads retrieve --thread-id <thread-id>
    notes:
      - "Costs are estimates, not invoices. In-flight usage can exceed the cap; reaching the threshold rejects new model requests, and unknown usage fails closed. Native provider protocols are unchanged."
      - "Budgeted runs expose run.budget with capUsd, estimatedCostUsd and state: available, settling, budget_exhausted or budget_usage_unavailable. Unavailable usage means the estimate covers only established usage."
      - "A budget failure remains a failed run. Inspect available files and events; --final-output is only for completed runs, and a failed turn does not guarantee a successful checkpoint."
  thread-events-list-events:
    use: list-events
    short: "List thread events"
    long: "Return recent events for a thread on the Public Thread API."
    example: |
      mosoo public-thread-api-v2 events list-events --thread-id <thread-id>
    known_errors:
      - status: 401
        cause: "Invalid or revoked credential. Rotate the Project API key or run mosoo auth login again."
      - status: 404
        cause: "Thread not found for this caller."
  thread-events-send:
    use: send
    short: "Send events to a thread"
    long: "Send user messages, permission decisions, or interrupts to a thread session. Optional top-level maxCostUsd applies only to a user_message turn in this request; it does not change earlier turns or later defaults. Per-turn budgets are unreleased; verify support on the target deployment before using maxCostUsd."
    example: |
      mosoo public-thread-api-v2 events send --thread-id <thread-id> --file events.json
    examples:
      - summary: "Send a user message event to an existing thread."
        command: "mosoo public-thread-api-v2 events send --thread-id <thread-id> --file events.json -o json"
        body_shape:
          events:
            -
              type: user_message
              text: "Continue the task with this follow-up."
              requestId: cli-send-001
        output_hints:
          list_path: events
        follow_up_commands:
          - "mosoo public-thread-api-v2 events list-events --thread-id <thread-id> -o json"
      - summary: "Send a new user-message turn with a caller-selected estimate cap; set TURN_MAX_COST_USD first."
        command: "mosoo public-thread-api-v2 events send --thread-id <thread-id> --set \"events[0].type=user_message\" --set-str \"events[0].text=Continue this task.\" --set \"maxCostUsd=$TURN_MAX_COST_USD\" -o json"
        output_hints:
          list_path: events
    notes:
      - "Set top-level maxCostUsd with --set maxCostUsd=<usd-amount> or a numeric JSON field in --file. Choose a positive USD amount with at most six decimal places, within the deployment policy maximum."
      - "The cap applies only to this turn. Omission uses the deployment's configured default when available; the CLI does not supply a default amount or platform-funded inference."
      - "A deployment budget policy is required for an explicit cap. Without it the request fails with 409 readiness_blocked. Check the target's v2 schema and budget readiness; the last verified staging source is 69de7cea without budgets, and e060f465 budget deployment and live validation are pending."
      - "Costs are estimates, not invoices. In-flight usage can exceed the cap; reaching the threshold rejects new model requests, and unknown usage fails closed. Native provider protocols are unchanged."
      - "Budgeted runs expose run.budget with capUsd, estimatedCostUsd and state: available, settling, budget_exhausted or budget_usage_unavailable. Unavailable usage means the estimate covers only established usage."
      - "A budget failure remains a failed run. Inspect available files and events; --final-output is only for completed runs, and a failed turn does not guarantee a successful checkpoint."
    known_errors:
      - status: 401
        cause: "Invalid or revoked credential. Rotate the Project API key or run mosoo auth login again."
      - status: 409
        cause: "Idempotency key reused while the original request is still processing."
      - status: 400
        cause: "maxCostUsd is invalid, exceeds the deployment maximum, or is supplied without a user_message event."
      - status: 409
        cause: "readiness_blocked: an explicit maxCostUsd was supplied but this deployment has no budget policy."
  thread-events-stream:
    use: stream
    short: "Stream thread events (SSE)"
    long: "Open a Server-Sent Events stream of thread events. Use -o raw for the event stream."
    example: |
      mosoo public-thread-api-v2 events stream --thread-id <thread-id> -o raw
  thread-files-list-files:
    use: list-files
    short: "List thread files"
    long: "List files attached to a thread."
    example: |
      mosoo public-thread-api-v2 files list-files --thread-id <thread-id>
  thread-files-remove:
    use: remove
    short: "Remove a thread file"
    long: "Detach a file from a thread."
    example: |
      mosoo public-thread-api-v2 files remove --thread-id <thread-id> --file-id <file-id>
  unarchive:
    short: "Unarchive a thread"
    long: "Restore an archived thread to the active list."
    example: |
      mosoo public-thread-api-v2 threads unarchive --thread-id <thread-id>
  usage:
    short: "Read recorded Session usage"
    long: "Read paginated persisted usage observations. Missing values are null, not zero. Provider cost estimates are not invoices or complete upstream request accounting."
    example: |
      mosoo public-thread-api-v2 threads usage --thread-id <thread-id> -o json
