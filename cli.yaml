cli:
  name: mosoo
  short: "mosoo CLI for integrators: Public Thread API (/api/v1), Console GraphQL (/api/graphql), and console REST (/api/*)"
  command_path: namespaced

auth:
  login:
    type: oauth_device
    start_path: /auth/cli/start
    token_path: /auth/cli/token
  validate:
    method: GET
    path: /access-tokens

update:
  github:
    owner: langgenius
    repo: mosoo-connector
    asset: "{{ .Name }}-{{ .OS }}-{{ .Arch }}.tar.gz"

skill:
  root: .cache/lathe-skill
  include: publish/skills/mosoo/lathe-include
