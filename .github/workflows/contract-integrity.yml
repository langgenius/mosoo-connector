name: Contract integrity

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  generated-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: oven-sh/setup-bun@v2

      - name: Regenerate pinned Mosoo contract
        run: |
          upstream_sha="$(sed -n 's/^[[:space:]]*"upstreamCommit": "\([0-9a-f]*\)",*$/\1/p' specs/mosoo-contract.json)"
          make contract-gate MOSOO_REF="$upstream_sha"
