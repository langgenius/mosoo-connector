sources:
  threads:
    display_name: public-thread-api
    default_hostname: http://127.0.0.1:8787/api/v1
    repo_url: https://github.com/langgenius/mosoo.git
    pinned_tag: dadfb757b2804417e987b3fc1fe17c8796eaf058
    backend: openapi3
    openapi3:
      files:
        - docs/openapi/public-thread-api.openapi.json
  threadsv2:
    display_name: public-thread-api-v2
    default_hostname: http://127.0.0.1:8787/api/v2
    repo_url: https://github.com/langgenius/mosoo.git
    pinned_tag: dadfb757b2804417e987b3fc1fe17c8796eaf058
    backend: openapi3
    openapi3:
      files:
        - docs/openapi/public-thread-api.v2.openapi.json
  console:
    display_name: console
    default_hostname: http://127.0.0.1:8787/api
    repo_url: https://github.com/langgenius/mosoo.git
    pinned_tag: dadfb757b2804417e987b3fc1fe17c8796eaf058
    backend: graphql
    graphql:
      schema: docs/graphql/console.graphql
      expose:
        queries:
          - accessibleAgentList
          - agent
          - agentCostCard
          - agentEditorState
          - agentManifest
          - agentSessionDiagnostics
          - agentSessionList
          - availableAgentModels
          - environment
          - exportAgentPackage
          - fileList
          - mcpOAuthFlowStatus
          - mcpRegistry
          - projectCostCard
          - projectEnvironmentList
          - projectList
          - projectSkillList
          - skillDetail
          - threadAgentSessionList
          - threadAgentSessionRetrieve
          - threadSessionMessages
          - threadSessionProcessEvents
          - vendorCredentialList
          - viewer
        mutations:
          - addSessionResource
          - archiveAgentSession
          - connectMcpBearer
          - createAgent
          - createAgentFork
          - createAgentSession
          - createEnvironment
          - createProject
          - createProjectMcpServer
          - createSkillFork
          - createVendorCredential
          - deleteAgent
          - deleteAgentSession
          - deleteEnvironment
          - deleteMcpServer
          - deleteOwnedSkill
          - deleteVendorCredential
          - importAgentPackage
          - onboardingBootstrap
          - prewarmAgentSession
          - publishAgent
          - recreateSessionSandbox
          - renameOrganization
          - renameProject
          - restartSessionDriver
          - revokeMcpCredential
          - setDefaultVendorCredential
          - setMcpServerEnabled
          - setProjectDefaultEnvironment
          - startMcpOAuth
          - testVendorCredential
          - unarchiveAgentSession
          - unpublishAgent
          - updateAgentConfig
          - updateEnvironment
          - updateProfile
          - updateProjectMcpServer
          - updateVendorCredential
      groups:
        - match:
            - accessibleAgentList
            - agent
            - agentEditorState
            - agentManifest
            - exportAgentPackage
            - createAgentFork
            - createAgent
            - deleteAgent
            - importAgentPackage
            - publishAgent
            - unpublishAgent
            - updateAgentConfig
          group: Agents
        - match:
            - agentCostCard
            - projectCostCard
          group: Cost
        - match:
            - environment
            - projectEnvironmentList
            - createEnvironment
            - deleteEnvironment
            - setProjectDefaultEnvironment
            - updateEnvironment
          group: Environments
        - match:
            - fileList
          group: Files
        - match:
            - mcpOAuthFlowStatus
            - mcpRegistry
            - connectMcpBearer
            - createProjectMcpServer
            - deleteMcpServer
            - revokeMcpCredential
            - setMcpServerEnabled
            - startMcpOAuth
            - updateProjectMcpServer
          group: MCP
        - match:
            - onboardingBootstrap
          group: Onboarding
        - match:
            - projectList
            - createProject
            - renameProject
          group: Projects
        - match:
            - agentSessionDiagnostics
            - threadAgentSessionList
            - threadAgentSessionRetrieve
            - threadSessionMessages
            - threadSessionProcessEvents
            - agentSessionList
            - restartSessionDriver
            - recreateSessionSandbox
            - addSessionResource
            - createAgentSession
            - prewarmAgentSession
            - archiveAgentSession
            - deleteAgentSession
            - unarchiveAgentSession
          group: Sessions
        - match:
            - projectSkillList
            - skillDetail
            - createSkillFork
            - deleteOwnedSkill
          group: Skills
        - match:
            - viewer
            - updateProfile
          group: User
        - match:
            - availableAgentModels
            - vendorCredentialList
            - createVendorCredential
            - deleteVendorCredential
            - setDefaultVendorCredential
            - testVendorCredential
            - updateVendorCredential
          group: Credentials
        - match:
            - renameOrganization
          group: Organization
      selection:
        max_depth: 5
  consolerest:
    display_name: console-rest
    default_hostname: http://127.0.0.1:8787/api
    repo_url: https://github.com/langgenius/mosoo.git
    pinned_tag: dadfb757b2804417e987b3fc1fe17c8796eaf058
    backend: openapi3
    openapi3:
      files:
        - docs/openapi/console-rest.openapi.json
